name: Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.4.1)'
        required: false
        default: 'v0.4.1'
  push:
    tags:
      - 'v*'
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Package Release
        id: package
        shell: powershell
        run: |
          .\package_release.ps1

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Diswin-Release
          path: dist/*.*
